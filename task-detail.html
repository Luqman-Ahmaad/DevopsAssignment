<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Detail</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="add-task.html">Add Task</a>
        <a href="task-list.html">Task List</a>
        <a href="task-detail.html">Task Detail</a>
        <a href="about.html">About</a>
    </nav>
</header>


<div class="container">

    <h1>Task Details</h1>


    <div class="card task-detail">

        <h2 id="taskTitle">
            Complete Website Development
        </h2>


        <div class="detail-item">
            <h3>Description</h3>
            <p id="taskDescription">
                Complete the frontend development of TaskFlow application.
            </p>
        </div>


        <div class="detail-item">
            <h3>Due Date</h3>
            <p id="taskDate">
                20 June 2026
            </p>
        </div>


        <div class="detail-item">
            <h3>Priority</h3>
            <p>
                <span class="priority high">
                    High
                </span>
            </p>
        </div>


        <div class="detail-item">
            <h3>Status</h3>
            <p>
                <span class="status pending">
                    Pending
                </span>
            </p>
        </div>


        <div class="task-actions">

            <button class="btn btn-success">
                Mark as Complete
            </button>


            <button class="btn btn-danger">
                Delete
            </button>

        </div>

    </div>


</div>


<footer>
    <p>
        TaskFlow - Simplify Your Tasks | Developed by Team Lead
    </p>
</footer>


</body>
</html>
